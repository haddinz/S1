apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: support
  template:
    metadata:
      labels:
        app: support
    spec:
      containers:
        - name: support
          image: dockerpoenyagua/support:latest
          env:
            - name: ASPNETCORE_URLS 
              value: http://+:80
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: support-clusterip-srv
spec:
  type: ClusterIP
  selector:
    app: support
  ports:
  - name: support
    protocol: TCP
    port: 80
    targetPort: 8080
  - name: supportgrpc
    protocol: TCP
    port: 666
    targetPort: 5001